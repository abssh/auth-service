name: CI

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - ci/**

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
    
      - uses: actions/checkout@v6

      - uses: actions/setup-go@7
        with:
          version: "1.26.5"

      - run: go test -v ./...
